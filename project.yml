name: JumpStart
options:
  bundleIdPrefix: com.nikogray
  deploymentTarget:
    iOS: "26.1"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  JumpStart:
    type: application
    platform: iOS
    info:
      path: JumpStart/Info.plist
      properties:
        CFBundleDisplayName: JumpStart
        NSCameraUsageDescription: "JumpStart uses your camera locally to recognize jumping jacks. Video is never saved or uploaded."
        NSAlarmKitUsageDescription: "JumpStart schedules wake-up alarms that you configure."
    sources:
      - path: JumpStart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikogray.jumpstart
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
